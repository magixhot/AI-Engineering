[project]
name = "ai-engineering"
version = "0.1.0"
description = "Engineering MCP Server and engineering tools."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.27,<1.28",
]

[dependency-groups]
dev = [
    "pytest>=9.0",
    "ruff>=0.13",
    "mypy>=1.18",
]

[tool.pytest.ini_options]
pythonpath = [
    "src",
]

testpaths = [
    "tests",
]

python_files = [
    "test_*.py",
]

addopts = [
    "-ra",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = true
ignore_missing_imports = true