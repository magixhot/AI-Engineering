name: Quality

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      GIT_AUTHOR_NAME: AI-Engineering CI
      GIT_AUTHOR_EMAIL: ai-engineering-ci@example.invalid
      GIT_COMMITTER_NAME: AI-Engineering CI
      GIT_COMMITTER_EMAIL: ai-engineering-ci@example.invalid
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v10
      - run: uv sync --locked --group dev
      - run: uv run python -m ruff check .
      - run: uv run python -m mypy src tests
      - run: uv run python -m pytest
