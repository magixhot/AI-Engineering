name: Quality

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      GIT_AUTHOR_NAME: AI-Engineering CI
      GIT_AUTHOR_EMAIL: ai-engineering-ci@example.invalid
      GIT_COMMITTER_NAME: AI-Engineering CI
      GIT_COMMITTER_EMAIL: ai-engineering-ci@example.invalid
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - run: uv sync --locked --group dev
      - name: Verify canonical project-state coherence
        run: uv run python -B -m ai_engineering.project_state_coherence .
      - run: uv run python -m ruff check .
      - run: uv run python -m mypy src tests
      - run: uv run python -m pytest
      - name: Verify exact post-merge Quality gate
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          uv run python -m ai_engineering.quality_verifier
          "${{ github.repository }}"
          "${{ github.event.pull_request.base.sha }}"
